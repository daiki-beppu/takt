name: Nix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  nix-deps-sync:
    name: Check Nix dependencies are synced
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: npm install --global npm@11.16.0
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - run: |
          if ! node scripts/sync-nix-deps.mjs --check; then
            echo "::error::package-lock.json or flake.nix npmDepsHash is out of sync. Run 'npm run sync:nix-deps' and commit package-lock.json and flake.nix."
            exit 1
          fi

  flake:
    name: Build and test Nix flake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
      - run: nix flake check -L
      - run: nix build .#default -L
      - run: |
          claude_runtime="$(find result/lib/node_modules/takt/node_modules -type f -path '*/@anthropic-ai/claude-agent-sdk-*/claude' -print -quit)"
          codex_runtime="$(find result/lib/node_modules/takt/node_modules -type f -path '*/@openai/codex-*/vendor/*/bin/codex' -print -quit)"
          pi_sdk="$(find result/lib/node_modules/takt/node_modules -type f -path '*/@earendil-works/pi-coding-agent/dist/index.js' -print -quit)"
          node_runtime="$(sed -n '1s/^#!//p' result/lib/node_modules/takt/bin/takt)"
          test -n "$claude_runtime"
          test -x "$claude_runtime"
          test -n "$codex_runtime"
          test -x "$codex_runtime"
          test -n "$pi_sdk"
          test -x "$node_runtime"
          "$node_runtime" --input-type=module -e "await import('./$pi_sdk')"
      - run: NO_UPDATE_NOTIFIER=1 ./result/bin/takt --version
      - run: NO_UPDATE_NOTIFIER=1 nix run .#default -- --version
      - run: |
          nix profile install .#default --profile "$RUNNER_TEMP/takt-profile"
          NO_UPDATE_NOTIFIER=1 "$RUNNER_TEMP/takt-profile/bin/takt" --version
